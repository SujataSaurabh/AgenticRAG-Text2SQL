name: Deploy Text-to-SQL RAG to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: als-user-office-software   # Change to your GCP project ID
  REGION: us-central1
  REPOSITORY: rag-repo
  SERVICE_NAME: text2sql-rag-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to GCP
      if: ${{ secrets.GCP_SA_KEY != '' }}
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      if: ${{ secrets.GCP_SA_KEY != '' }}
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      if: ${{ secrets.GCP_SA_KEY != '' }}
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    - name: Build and Push Docker Image
      if: ${{ secrets.GCP_SA_KEY != '' }}
      run: |
        IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
        docker build -t $IMAGE_URI .
        docker push $IMAGE_URI

    - name: Deploy to Cloud Run
      if: ${{ secrets.GCP_SA_KEY != '' }}
      run: |
        IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image=$IMAGE_URI \
          --region=${{ env.REGION }} \
          --platform=managed \
          --memory=8Gi \
          --cpu=4 \
          --timeout=60s \
          --allow-unauthenticated

    - name: Skip deploy (GCP_SA_KEY not configured)
      if: ${{ secrets.GCP_SA_KEY == '' }}
      run: echo "Skipping deployment because the GCP_SA_KEY secret is not configured."