name: Deploy Text-to-SQL RAG to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: als-user-office-software
  REGION: us-central1
  REPOSITORY: rag-repo
  API_SERVICE: text2sql-rag-service
  UI_SERVICE: text2sql-ui
  API_SA: pubschat-api
  UI_SA: pubschat-ui
  # Gemini model on Vertex AI (change here to switch models)
  GEMINI_MODEL: gemini-3.5-flash-lite
  # Database: sqlite (bundled file) or postgres (Cloud SQL). Set the repo
  # variable DB_BACKEND to switch without editing this file.
  DB_BACKEND: ${{ vars.DB_BACKEND || 'sqlite' }}
  CLOUDSQL_INSTANCE: als-user-office-software:us-central1:pubs-reporting
  DB_NAME: pubsreporting
  # Prebuilt SQLite extract (kept out of the public repo)
  DB_GCS_URI: gs://als-user-office-software-pubschat-data/database.db

jobs:
  build-api:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Fetch database
        run: gcloud storage cp "$DB_GCS_URI" ./database.db

      - id: meta
        run: echo "image=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${API_SERVICE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f Dockerfile -t "${{ steps.meta.outputs.image }}" .
          docker push "${{ steps.meta.outputs.image }}"

  build-ui:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: meta
        run: echo "image=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${UI_SERVICE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push UI image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f Dockerfile.ui -t "${{ steps.meta.outputs.image }}" .
          docker push "${{ steps.meta.outputs.image }}"

  deploy:
    runs-on: ubuntu-latest
    needs: [build-api, build-ui]
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API (private)
        run: |
          gcloud run deploy "$API_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="${{ needs.build-api.outputs.image }}" \
            --service-account="${API_SA}@${PROJECT_ID}.iam.gserviceaccount.com" \
            --no-allow-unauthenticated \
            --memory=512Mi --cpu=1 --cpu-boost \
            --concurrency=4 --max-instances=2 --min-instances=0 \
            --timeout=120 \
            --set-env-vars="LLM_BACKEND=vertex,GEMINI_MODEL=${GEMINI_MODEL},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global,DB_BACKEND=${DB_BACKEND},CLOUDSQL_INSTANCE=${CLOUDSQL_INSTANCE},DB_NAME=${DB_NAME},DB_USER=${API_SA}@${PROJECT_ID}.iam"

      - name: Allow the UI to call the API
        run: |
          gcloud run services add-iam-policy-binding "$API_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --member="serviceAccount:${UI_SA}@${PROJECT_ID}.iam.gserviceaccount.com" \
            --role=roles/run.invoker

      - name: Deploy UI (behind IAP, Google sign-in)
        run: |
          API_URL=$(gcloud run services describe "$API_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')
          gcloud run deploy "$UI_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="${{ needs.build-ui.outputs.image }}" \
            --service-account="${UI_SA}@${PROJECT_ID}.iam.gserviceaccount.com" \
            --no-allow-unauthenticated \
            --iap \
            --memory=1Gi --cpu=1 \
            --max-instances=2 --min-instances=0 \
            --session-affinity \
            --timeout=3600 \
            --set-env-vars="FASTAPI_URL=${API_URL}/query,API_AUDIENCE=${API_URL},REQUEST_TIMEOUT=120"

      - name: Let IAP forward signed-in users to the UI
        run: |
          # Who may sign in (e.g. domain:lbl.gov) is set once by deploy/grant_lab_access.sh
          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          gcloud run services add-iam-policy-binding "$UI_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --member="serviceAccount:service-${PROJECT_NUMBER}@gcp-sa-iap.iam.gserviceaccount.com" \
            --role=roles/run.invoker

      - name: Smoke test API health
        run: |
          API_URL=$(gcloud run services describe "$API_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')
          TOKEN=$(gcloud auth print-identity-token --audiences="$API_URL")
          curl -fsS --max-time 60 -H "Authorization: Bearer $TOKEN" "$API_URL/health"
          # End-to-end check that Vertex AI + the database work (costs < $0.001)
          curl -fsS --max-time 110 -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"question":"How many publications are there in 2019?","history":[]}' \
            "$API_URL/query"

      - name: Show Cloud Run logs on failure
        if: failure()
        run: |
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND (resource.labels.service_name=\"${API_SERVICE}\" OR resource.labels.service_name=\"${UI_SERVICE}\")" \
            --project="$PROJECT_ID" --limit=50 --freshness=1h \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)'
